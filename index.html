<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRain</title>
<style>
  :root{
    --bg: #15171a;
    --card: #1e2125;
    --card-hover: #262a2f;
    --ink: #e8e8e8;
    --muted: #8a8f96;
    --accent: #d8ae57;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }
  h1{
    font-weight:600;
    letter-spacing:0.02em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  p.sub{
    color: var(--muted);
    margin-top:0;
    margin-bottom: 32px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 640px;
  }
  a.card{
    display:block;
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    text-decoration:none;
    color: var(--ink);
    border: 1px solid #2a2d31;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.card:hover{
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  a.card .title{
    font-size: 1.1em;
    font-weight: 600;
    margin-bottom: 4px;
  }
  a.card .desc{
    font-size: 0.9em;
    color: var(--muted);
  }
  footer{
    margin-top: 48px;
    color: var(--muted);
    font-size: 0.85em;
  }
</style>
</head>
<body>
  <h1>XRain</h1>
  <p class="sub">мои проекты</p>
  <div class="grid">
    <a class="card" href="cats.html">
      <div class="title">Котокорабль</div>
      <div class="desc">игра</div>
    </a>
    <a class="card" href="poker.html">
      <div class="title">Таймер блайндов</div>
      <div class="desc">покерный таймер</div>
    </a>
    <a class="card" href="chips.html">
      <div class="title">Покерные фишки</div>
      <div class="desc">виртуальные фишки для домашней игры</div>
    </a>
    <a class="card" href="newtab.html">
      <div class="title">New Tab</div>
      <div class="desc">минималистичная страница новой вкладки</div>
    </a>
  </div>
  <footer>xrain.ru</footer>
</body>
</html>
