<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймер блайндов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-1: #0d3324;
    --felt-2: #0a2a1d;
    --felt-edge: #06180f;
    --gold: #d8ae57;
    --gold-dim: #a8823f;
    --cream: #f2ead6;
    --cream-dim: #cbbfa2;
    --rail: #4a2a1a;
    --rail-dark: #34190f;
    --danger: #c1543a;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 90% at 50% -10%, #12452f 0%, var(--felt-1) 45%, var(--felt-2) 78%, var(--felt-edge) 100%);
    background-color: var(--felt-2);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 16px;
    overflow-x:hidden;
  }
  /* subtle felt texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
    pointer-events:none;
  }

  .table{
    width:100%;
    max-width: 1200px;
    /*border: 10px solid var(--rail);*/
    border-color: var(--rail);
    border-image: linear-gradient(180deg, #5c3520, #2b160c) 1;
    border-radius: 40px;
    padding: 8px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      inset 0 0 0 4px var(--rail-dark);
  }
  .felt{
    border-radius: 32px;
    padding: 48px 48px 40px;
    background:
      radial-gradient(ellipse 100% 80% at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
      var(--felt-1);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45);
  }

  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .level-tag{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size: clamp(24px, 2.6vw, 34px);
    letter-spacing: 0.04em;
    color: var(--cream-dim);
  }
  .level-tag b{ color: var(--gold); font-weight:600; }
  .elapsed{
    font-family:'Oswald', sans-serif;
    font-size: clamp(24px, 2.6vw, 34px);
    color: var(--cream-dim);
    letter-spacing:0.02em;
  }

  .timer-wrap{
    text-align:center;
    margin: 6px 0 30px;
  }
  .timer{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size: clamp(150px, min(26vw, 30vh), 320px);
    line-height:1;
    letter-spacing: 0.01em;
    color: var(--cream);
    text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 40px rgba(216,174,87,0.08);
    font-variant-numeric: tabular-nums;
  }
  .timer.warn{ color: #e8c874; }
  .timer.danger{ color: var(--danger); text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 30px rgba(193,84,58,0.35); }
  .timer.paused{ opacity:0.45; }

  .progress{
    width: 100%;
    max-width: 700px;
    height: 10px;
    margin: 18px auto 0;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 4px;
    transition: width 1s linear;
  }

  .blinds-row{
    margin-bottom: 22px;
  }
  .blind-card{
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(216,174,87,0.18);
    border-radius: 18px;
    padding: 28px 24px;
    position:relative;
    text-align:center;
  }
  .blind-label{
    font-size: clamp(18px, 2vw, 26px);
    color: var(--cream-dim);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .blind-values{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: clamp(56px, 9vw, 90px);
    color: var(--gold);
    line-height:1.1;
    white-space: nowrap;
  }
  .blind-values .ante{
    color: var(--cream-dim);
  }

  .hidden{ display:none; }
  .chip{
    position:absolute;
    top: 16px; right: 18px;
    width: 30px; height:30px;
    border-radius:50%;
    background: repeating-conic-gradient(var(--gold) 0deg 20deg, #7a5b25 20deg 40deg);
    box-shadow: 0 0 0 2px var(--felt-1), 0 0 0 3px rgba(216,174,87,0.4);
  }

  .next-line{
    text-align:center;
    margin-top: 10px;
    font-size: clamp(20px, 2.2vw, 28px);
    color: var(--cream-dim);
  }
  .next-line b{ color: var(--cream); font-weight:600; }

  .controls{
    display:flex;
    justify-content:center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: clamp(20px, 2.2vw, 26px);
    border:none;
    border-radius: 12px;
    padding: 22px 36px;
    cursor:pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
    letter-spacing: 0.01em;
  }
  button:active{ transform: scale(0.96); }
  .btn-main{
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #241505;
    min-width: 180px;
  }
  .btn-main:hover{ filter: brightness(1.08); }
  .btn-ghost{
    background: rgba(255,255,255,0.07);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-ghost:hover{ background: rgba(255,255,255,0.12); }

  .settings{
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: clamp(18px, 2vw, 22px);
    color: var(--cream-dim);
  }
  .settings input{
    width: 70px;
    text-align:center;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream);
    border-radius: 8px;
    padding: 8px 6px;
    font-family:'Oswald', sans-serif;
    font-size: clamp(18px, 2vw, 22px);
  }
  .settings input:focus{ outline: 1px solid var(--gold); }
  .settings.hidden, .controls.hidden{ display:none; }

  .gear-btn{
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 22px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .gear-btn:hover{ background: rgba(255,255,255,0.12); }

  @media (max-width: 460px){
    .blinds-row{ grid-template-columns: 1fr; }
    .felt{ padding: 26px 18px 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .progress-bar{ transition:none; }
    button{ transition:none; }
  }
</style>
</head>
<body>

<div class="table">
  <div class="felt">

    <div class="top-row">
      <div class="level-tag">Уровень <b id="levelNum">1</b></div>
      <div class="elapsed">Прошло: <span id="elapsed">00:00</span></div>
    </div>

    <div class="timer-wrap">
      <div class="timer" id="timer">10:00</div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div class="blinds-row">
      <div class="blind-card current">
        <div class="chip"></div>
        <div class="blind-label">Текущие блайнды</div>
        <div class="blind-values" id="curBlinds">10 / 10</div>
      </div>
      <div class="next-line" id="nextLine">Далее: 10 / 10, анте 10</div>
    </div>

    <div class="controls hidden" id="controlsPanel">
      <button class="btn-ghost" id="prevBtn">← Уровень</button>
      <button class="btn-main" id="toggleBtn">Пауза</button>
      <button class="btn-ghost" id="nextBtn">Уровень →</button>
      <button class="btn-ghost" id="resetBtn">Сброс</button>
    </div>

    <div class="settings hidden" id="settingsPanel">
      <label for="durInput">Минут на уровень:</label>
      <input type="number" id="durInput" min="1" max="60" value="10">
      <span id="applyMsg" style="min-width:0;"></span>
    </div>

  </div>
</div>

<button class="gear-btn" id="settingsBtn" aria-label="Настройки" title="Настройки">⚙</button>

<script>
(function(){
  // Структура блайндов:
  // 10/10 без анте, 10/10 анте 10, 10/20 анте 20, 10/30 анте 30,
  // затем 20/40 ... 100/200 (шаг SB +10, BB = 2×SB),
  // а после 100/200 — классическая "круглая" прогрессия:
  // 150/300, 200/400, 300/600, 400/800, 500/1000, 600/1200, 800/1600,
  // 1000/2000, 1500/3000 и т.д. (умножаем на 1.5, 2, 3, 4, 5, 6, 8, затем ×10)
  function generateLevels(totalLevels){
    const levels = [
      { sb: 10, bb: 10, ante: 0 },
      { sb: 10, bb: 10, ante: 10 },
      { sb: 10, bb: 20, ante: 20 },
      { sb: 10, bb: 30, ante: 30 },
    ];

    // линейный рост с шагом 10 до SB = 100
    for(let k = 2; k <= 10; k++){
      const sb = 10 * k;
      const bb = sb * 2;
      levels.push({ sb: sb, bb: bb, ante: bb });
    }

    // после 100/200 — "круглая" прогрессия по декадам
    const base = [1, 1.5, 2, 3, 4, 5, 6, 8];
    let decade = 100;
    let i = 1; // начинаем с 1.5×decade (150), т.к. 1×100 уже добавлено выше
    while(levels.length < totalLevels){
      const sb = Math.round(decade * base[i]);
      const bb = sb * 2;
      levels.push({ sb: sb, bb: bb, ante: bb });
      i++;
      if(i >= base.length){ i = 0; decade *= 10; }
    }

    return levels;
  }

  const LEVELS = generateLevels(60); // с запасом на много часов игры

  let levelDuration = 10 * 60; // секунды, по умолчанию 10 минут
  let currentLevel = 0;
  let remaining = levelDuration;
  let elapsedTotal = 0;
  let running = false;
  let timerId = null;

  const els = {
    timer: document.getElementById('timer'),
    levelNum: document.getElementById('levelNum'),
    elapsed: document.getElementById('elapsed'),
    progressBar: document.getElementById('progressBar'),
    curBlinds: document.getElementById('curBlinds'),
    nextLine: document.getElementById('nextLine'),
    toggleBtn: document.getElementById('toggleBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    resetBtn: document.getElementById('resetBtn'),
    settingsBtn: document.getElementById('settingsBtn'),
    settingsPanel: document.getElementById('settingsPanel'),
    controlsPanel: document.getElementById('controlsPanel'),
    durInput: document.getElementById('durInput'),
  };

  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function render(){
    const lvl = LEVELS[currentLevel];
    const nxt = LEVELS[currentLevel + 1] || LEVELS[currentLevel];

    const curAnteText = lvl.ante > 0 ? (' <span class="ante">анте ' + lvl.ante + '</span>') : '';
    els.curBlinds.innerHTML = lvl.sb + ' / ' + lvl.bb + curAnteText;

    const nextAnteText = nxt.ante > 0 ? (', анте <b>' + nxt.ante + '</b>') : ', без анте';
    els.nextLine.innerHTML = 'Далее: <b>' + nxt.sb + ' / ' + nxt.bb + '</b>' + nextAnteText;

    els.levelNum.textContent = currentLevel + 1;
    els.timer.textContent = formatTime(remaining);
    els.elapsed.textContent = formatTime(elapsedTotal);

    const pct = Math.max(0, Math.min(100, (remaining / levelDuration) * 100));
    els.progressBar.style.width = pct + '%';

    els.timer.classList.remove('warn','danger','paused');
    if(!running) els.timer.classList.add('paused');
    else if(remaining <= 10) els.timer.classList.add('danger');
    else if(remaining <= 60) els.timer.classList.add('warn');

    els.toggleBtn.textContent = running ? 'Пауза' : 'Старт';
  }

  function tick(){
    if(remaining > 0){
      remaining -= 1;
      elapsedTotal += 1;
    } else {
      goToLevel(currentLevel + 1, false);
      return;
    }
    render();
  }

  function start(){
    if(running) return;
    running = true;
    timerId = setInterval(tick, 1000);
    render();
  }

  function pause(){
    running = false;
    clearInterval(timerId);
    render();
  }

  function toggle(){
    if(running) pause(); else start();
  }

  function goToLevel(idx, resetElapsedTime){
    if(idx < 0) idx = 0;
    if(idx >= LEVELS.length) idx = LEVELS.length - 1;
    currentLevel = idx;
    remaining = levelDuration;
    render();
  }

  function reset(){
    pause();
    currentLevel = 0;
    remaining = levelDuration;
    elapsedTotal = 0;
    render();
  }

  els.toggleBtn.addEventListener('click', toggle);
  els.nextBtn.addEventListener('click', () => goToLevel(currentLevel + 1));
  els.prevBtn.addEventListener('click', () => goToLevel(currentLevel - 1));
  els.resetBtn.addEventListener('click', reset);
  els.settingsBtn.addEventListener('click', () => {
    els.settingsPanel.classList.toggle('hidden');
    els.controlsPanel.classList.toggle('hidden');
  });

  els.durInput.addEventListener('change', () => {
    let mins = parseInt(els.durInput.value, 10);
    if(isNaN(mins) || mins < 1) mins = 10;
    if(mins > 60) mins = 60;
    els.durInput.value = mins;
    levelDuration = mins * 60;
    remaining = levelDuration;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){ e.preventDefault(); toggle(); }
  });

  render();
})();
</script>

</body>
</html>
